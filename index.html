<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1C7ED6">
<title>Grammar Ocean</title>
<style>
:root{
  color-scheme: light;
  --sky:#EAF4FB; --card:#FFFFFF; --ink:#15314B; --muted:#5A6E82; --line:#CFE0EE; --soft:#F3F8FC;
  --sea:#1C7ED6; --sea-deep:#0F2A44; --sea-ink:#0B4F8A; --sea-bg:#DDEEFB;
  --sun:#FFC933; --sun-ink:#8A5A00; --sun-bg:#FFF3C9;
  --coral:#FF6B57; --coral-ink:#B23A2A; --coral-bg:#FFE5E0;
  --foam:#20B99A; --foam-ink:#0B6E5B; --foam-bg:#D9F5EE;
  --rS:#1C7ED6; --rV:#E8590C; --rO:#7048E8; --rP:#0CA678; --rT:#D6336C; --rA:#D9480F; --rN:#495057; --rE:#E8590C; --rG:#8A9BAB;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Avenir Next", "Segoe UI", Roboto, system-ui, sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(16px, 2.6vw, 19px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--sky);color:var(--ink);font-family:var(--font);line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15;font-weight:800;letter-spacing:-.01em}
p{margin:0}
.hidden{display:none !important}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#1C7ED6,#1971C2);color:#fff;padding:.55rem max(1rem,env(safe-area-inset-left)) .55rem max(1rem,env(safe-area-inset-right));box-shadow:0 2px 10px rgba(15,42,68,.18)}
.topin{max-width:42rem;margin:0 auto;display:flex;align-items:center;gap:.5rem}
.brand{display:flex;align-items:center;gap:.4rem;font-weight:800;font-size:1rem;background:none;border:0;padding:0;color:#fff;white-space:nowrap}
.brand svg{width:2rem;height:2rem}
.stat{display:flex;align-items:center;gap:.2rem;font-weight:700;font-size:.85rem;white-space:nowrap}
.stat .ic{font-size:1.05rem}
.ring{--p:0;width:2.4rem;height:2.4rem;border-radius:50%;background:conic-gradient(var(--sun) calc(var(--p) * 1%), rgba(255,255,255,.25) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::after{content:"";position:absolute;inset:.28rem;border-radius:50%;background:#1C7ED6}
.ring b{position:relative;z-index:1;font-size:.72rem;font-weight:800}
.ring.done{background:var(--foam)}
.grow{flex:1}
.de-btn{border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:.6rem;padding:.15rem .5rem;font-weight:800;font-size:.8rem}
.de-btn.on{background:#fff;color:var(--sea-ink)}

/* Page */
main{max-width:42rem;margin:0 auto;padding:1rem max(1rem,env(safe-area-inset-left)) 4rem max(1rem,env(safe-area-inset-right))}
.view{animation:enter .3s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(.5rem)}to{opacity:1;transform:none}}

/* Finn */
.finn-row{display:flex;align-items:flex-end;gap:.8rem;margin-bottom:1rem}
.finn{width:5.2rem;flex:none;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-.35rem) rotate(3deg)}}
.bubble{position:relative;background:var(--card);border-radius:1.1rem;padding:.7rem 1rem;box-shadow:0 2px 0 var(--line);font-weight:600;flex:1;font-size:1rem}
.bubble::before{content:"";position:absolute;left:-.55rem;bottom:1rem;border:.6rem solid transparent;border-right-color:var(--card);border-left:0}
.bubble small{display:block;color:var(--muted);font-weight:600;font-size:.82rem;margin-top:.15rem}

/* Home */
.goal{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;background:var(--card);border-radius:1.2rem;padding:.9rem 1rem;margin-bottom:1.2rem;box-shadow:0 2px 0 var(--line)}
.port{width:5.4rem;height:5.4rem;border-radius:50%;border:.35rem solid #DCE9F3;position:relative;overflow:hidden;background:#F6FBFF;flex:none}
.wave{position:absolute;left:-50%;width:200%;height:200%;top:calc(100% - var(--lvl, 0%));background:var(--sea);border-radius:42%;animation:spin 7s linear infinite;opacity:.85;transition:top 1s ease}
.wave.w2{background:#74C0FC;animation-duration:11s;animation-direction:reverse;opacity:.55}
@keyframes spin{to{transform:rotate(360deg)}}
.port b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.05rem;font-weight:800;color:var(--sea-deep);text-shadow:0 1px 0 #fff;z-index:1}
.goal h2{font-size:1.1rem;margin-bottom:.15rem}
.goal p{color:var(--muted);font-weight:600;font-size:.9rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--soft);border-radius:2rem;padding:.2rem .6rem;font-weight:700;font-size:.85rem}
.chip.hot{background:var(--sun-bg);color:var(--sun-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:0;border-radius:1rem;padding:.75rem 1.2rem;font-weight:800;font-size:1.05rem;background:var(--sea);color:#fff;box-shadow:0 .25rem 0 var(--sea-ink);transition:transform .08s,box-shadow .08s;min-height:3rem}
.btn:active{transform:translateY(.2rem);box-shadow:0 .05rem 0 var(--sea-ink)}
.btn.sun{background:var(--sun);color:var(--sea-deep);box-shadow:0 .25rem 0 #D9A400}
.btn.sun:active{box-shadow:0 .05rem 0 #D9A400}
.btn.ghost{background:var(--card);color:var(--sea-ink);box-shadow:0 .25rem 0 var(--line)}
.btn.ghost:active{box-shadow:0 .05rem 0 var(--line)}
.btn.foam{background:var(--foam);box-shadow:0 .25rem 0 var(--foam-ink)}
.btn.foam:active{box-shadow:0 .05rem 0 var(--foam-ink)}
.btn.wide{width:100%}
.btn.sm{padding:.45rem .8rem;font-size:.9rem;min-height:2.3rem;border-radius:.75rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.sp{margin-top:1rem}

/* Island path */
.map{position:relative;padding:.4rem 0 .5rem;margin-top:.4rem}
.map::before{content:"";position:absolute;left:2.6rem;top:1rem;bottom:1.5rem;border-left:.3rem dotted #BBD5EA;z-index:0}
.isle{position:relative;z-index:1;display:grid;grid-template-columns:5.2rem 1fr;gap:.7rem;align-items:center;background:var(--card);border-radius:1.2rem;padding:.7rem .9rem .7rem .4rem;margin-bottom:.7rem;border:0;width:100%;text-align:left;box-shadow:0 2px 0 var(--line);transition:transform .1s}
.isle:active{transform:scale(.985)}
.isle .badge{width:4.3rem;height:4.3rem;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:var(--c-bg,#DDEEFB);border:.25rem solid var(--c,#1C7ED6);margin:0 auto;position:relative}
.isle .badge .n{position:absolute;right:-.3rem;bottom:-.3rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--c,#1C7ED6);color:#fff;font-size:.8rem;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.isle h3{font-size:1.1rem}
.isle p{color:var(--muted);font-weight:600;font-size:.88rem}
.stars{display:inline-flex;gap:.08rem;font-size:.95rem;letter-spacing:.02em;color:#D9A400}
.stars .off{color:#D5DEE7}
.isle .st{margin-top:.25rem;display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.85rem;color:var(--muted)}
.isle.next{outline:3px solid var(--sun);outline-offset:-3px}
.isle.next::after{content:"next";position:absolute;top:.55rem;right:.8rem;background:var(--sun);color:var(--sea-deep);font-size:.72rem;font-weight:800;padding:.1rem .5rem;border-radius:1rem}

/* Island page */
.ihead{display:flex;align-items:center;gap:.9rem;margin-bottom:1rem}
.ihead .badge{width:4rem;height:4rem;border-radius:50%;display:grid;place-items:center;font-size:1.9rem;background:var(--c-bg);border:.25rem solid var(--c);flex:none}
.ihead h2{font-size:1.4rem}
.ihead p{color:var(--muted);font-weight:600}
.stage{background:var(--card);border-radius:1.1rem;padding:.8rem .9rem;margin-bottom:.7rem;box-shadow:0 2px 0 var(--line)}
.stage .t{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.55rem}
.stage h3{font-size:1.05rem}
.stage .d{font-size:.88rem;color:var(--muted);font-weight:600}
.stage .row .btn{flex:1}
.back{display:inline-flex;align-items:center;gap:.3rem;border:0;background:none;color:var(--sea-ink);font-weight:800;padding:.2rem 0;margin-bottom:.6rem;font-size:.95rem}

/* Word tiles */
.tiles{display:flex;flex-wrap:wrap;gap:.45rem .5rem;align-items:center;min-height:3.4rem}
.tile{display:inline-flex;align-items:center;padding:.3em .6em .34em;border-radius:.55em;background:var(--card);border:2px solid var(--line);border-bottom-width:.22em;font-weight:800;font-size:1.25rem;line-height:1.15;color:var(--ink);white-space:nowrap;position:relative;transition:background-color .35s,color .35s,border-color .35s,transform .35s}
.tile.glue{margin-left:-.5rem;border-left-width:0;border-top-left-radius:0;border-bottom-left-radius:0;padding-left:.15em}
.tile.pre{border-right-width:0;border-top-right-radius:0;border-bottom-right-radius:0;padding-right:.15em}
.r-S{background:color-mix(in srgb,var(--rS) 13%,#fff);border-color:var(--rS);color:var(--rS)}
.r-V{background:color-mix(in srgb,var(--rV) 13%,#fff);border-color:var(--rV);color:var(--rV)}
.r-O{background:color-mix(in srgb,var(--rO) 13%,#fff);border-color:var(--rO);color:var(--rO)}
.r-P{background:color-mix(in srgb,var(--rP) 13%,#fff);border-color:var(--rP);color:var(--rP)}
.r-T{background:color-mix(in srgb,var(--rT) 13%,#fff);border-color:var(--rT);color:var(--rT)}
.r-A{background:color-mix(in srgb,var(--rA) 13%,#fff);border-color:var(--rA);color:var(--rA)}
.r-N{background:color-mix(in srgb,var(--rN) 11%,#fff);border-color:var(--rN);color:var(--rN)}
.r-E{background:var(--rE);border-color:var(--rE);color:#fff}
.r-G{color:var(--rG);border-color:#D5DEE7;border-style:dashed}
.r-X{background:var(--coral-bg);border-color:var(--coral);color:var(--coral-ink);text-decoration:line-through;text-decoration-thickness:.14em}
.r-Q{background:transparent;border-color:transparent;padding-inline:.05em;font-size:1.5rem}
.tile.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.tile.bye{animation:bye .3s ease-in both}
@keyframes bye{to{opacity:0;transform:scale(.4)}}
.tile.pulse{animation:pulse .5s ease}
@keyframes pulse{40%{transform:scale(1.18)}}
.tile.tap{cursor:pointer}
.tile.tap:active{transform:scale(.95)}
.tile.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-.3rem)}40%,80%{transform:translateX(.3rem)}}
.tile.sel{outline:3px solid var(--sun);outline-offset:2px}
.tile.sm{font-size:1.02rem;padding:.22em .5em .26em}
.legend{display:flex;flex-wrap:wrap;gap:.35rem .8rem;margin:.6rem 0 0;font-size:.82rem;font-weight:700}
.legend span::before{content:"";display:inline-block;width:.7rem;height:.7rem;border-radius:.2rem;margin-right:.3rem;background:var(--c);vertical-align:-.05rem}

/* Learn */
.scene{background:var(--card);border-radius:1.2rem;padding:1.1rem 1rem 1rem;box-shadow:0 2px 0 var(--line);min-height:12rem;display:flex;flex-direction:column;gap:.9rem}
.scene .tiles{min-height:4rem;align-content:center}
.scene .say{font-size:1.08rem;font-weight:700;min-height:2.6em}
.scene .de{font-size:.95rem;color:var(--sea-ink);font-weight:600;background:var(--sea-bg);border-radius:.7rem;padding:.45rem .7rem}
.scene .step{font-size:.82rem;color:var(--muted);font-weight:700}
.scene .group{display:flex;flex-wrap:wrap;gap:.35rem .9rem;align-items:center}
.lrow{display:flex;gap:.6rem;margin-top:.9rem}
.lrow .btn{flex:1}
.dots{display:flex;gap:.3rem;justify-content:center;margin:.8rem 0 .2rem}
.dots i{width:.5rem;height:.5rem;border-radius:50%;background:#C6D8E8}
.dots i.on{background:var(--sea)}

/* Practise */
.prog{display:flex;gap:.25rem;margin-bottom:.9rem}
.prog i{flex:1;height:.55rem;border-radius:.3rem;background:#C6D8E8;transition:background-color .3s}
.prog i.ok{background:var(--foam)}
.prog i.half{background:var(--sun)}
.prog i.no{background:var(--coral)}
.prog i.cur{background:var(--sea);animation:blink 1s infinite alternate}
@keyframes blink{to{opacity:.45}}
.task{background:var(--card);border-radius:1.2rem;padding:1rem;box-shadow:0 2px 0 var(--line)}
.task .ask{font-weight:700;color:var(--muted);font-size:.9rem;margin-bottom:.6rem}
.sentence{font-size:1.45rem;font-weight:800;line-height:1.5;letter-spacing:-.005em}
.gap{display:inline-block;min-width:4.2em;border-bottom:.18em solid var(--sea);text-align:center;color:var(--sea);padding:0 .2em;vertical-align:baseline}
.gap.ok{color:var(--foam-ink);border-color:var(--foam)}
.gap.no{color:var(--coral-ink);border-color:var(--coral);text-decoration:line-through}
.hintw{display:inline-block;font-weight:700;color:var(--muted);font-size:.8em;margin-left:.25em}
.opts{display:grid;gap:.55rem;margin-top:1rem}
.opt{border:2px solid var(--line);border-bottom-width:.28rem;background:var(--card);border-radius:.9rem;padding:.7rem 1rem;font-weight:800;font-size:1.15rem;text-align:left;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--foam-bg);border-color:var(--foam);color:var(--foam-ink)}
.opt.no{background:var(--coral-bg);border-color:var(--coral);color:var(--coral-ink)}
.opt.dim{opacity:.5}
.typed{display:flex;gap:.5rem;margin-top:1rem}
.typed input{flex:1;min-width:0;border:2px solid var(--line);border-bottom-width:.28rem;border-radius:.9rem;padding:.6rem .8rem;font-weight:800;font-size:1.15rem;color:var(--ink);background:var(--card)}
.typed input.ok{border-color:var(--foam);background:var(--foam-bg)}
.typed input.no{border-color:var(--coral);background:var(--coral-bg)}
.build{min-height:3.6rem;border:2px dashed var(--line);border-radius:.9rem;padding:.45rem .5rem;margin:.7rem 0;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;background:var(--soft)}
.build:empty::before{content:"Tap the tiles in the right order";color:var(--muted);font-weight:600;font-size:.9rem;padding:.3rem .2rem}
.pool{display:flex;flex-wrap:wrap;gap:.45rem;min-height:3rem}
.pool .tile{visibility:visible}
.pool .tile.used{visibility:hidden}
.fb{margin-top:.9rem;border-radius:.9rem;padding:.7rem .9rem;font-weight:700;display:flex;gap:.6rem;align-items:flex-start;animation:enter .25s ease-out}
.fb.ok{background:var(--foam-bg);color:var(--foam-ink)}
.fb.no{background:var(--coral-bg);color:var(--coral-ink)}
.fb.hint{background:var(--sun-bg);color:var(--sun-ink)}
.fb .ic{font-size:1.3rem;line-height:1}
.fb .ans{display:block;font-size:1.15rem;margin-top:.2rem}
.fb small{display:block;font-weight:600;font-size:.88rem;margin-top:.15rem;opacity:.9}
.fb .de{display:block;font-weight:600;font-size:.88rem;margin-top:.25rem;color:var(--sea-ink)}
.combo{position:fixed;left:50%;top:4.2rem;transform:translateX(-50%);background:var(--sun);color:var(--sea-deep);font-weight:900;padding:.3rem .9rem;border-radius:2rem;animation:combo 1.3s ease both;z-index:9;pointer-events:none}
@keyframes combo{0%{opacity:0;transform:translate(-50%,.5rem) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-.8rem)}}
.xp-float{position:fixed;font-weight:900;color:var(--foam-ink);animation:floatup 1s ease-out both;pointer-events:none;z-index:9}
@keyframes floatup{from{opacity:1}to{opacity:0;transform:translateY(-2.5rem)}}
.flash{text-align:center;padding:.5rem 0}
.flash .base{font-size:2.3rem;font-weight:900;color:var(--rV)}
.flash .mean{color:var(--muted);font-weight:700}
.flash .ex{margin-top:.6rem;font-size:1.15rem;font-weight:700}

/* Result */
.result{text-align:center;background:var(--card);border-radius:1.4rem;padding:1.4rem 1rem;box-shadow:0 2px 0 var(--line)}
.result .big{font-size:2.4rem;letter-spacing:.05em;margin:.3rem 0}
.result .big span{display:inline-block;animation:starin .6s cubic-bezier(.2,.9,.3,1.4) both}
.result .big span:nth-child(2){animation-delay:.2s}
.result .big span:nth-child(3){animation-delay:.4s}
@keyframes starin{from{opacity:0;transform:scale(0) rotate(-40deg)}}
.result h2{font-size:1.5rem}
.result p{color:var(--muted);font-weight:600;margin-top:.3rem}
.result .nums{display:flex;justify-content:center;gap:1.2rem;margin:1rem 0}
.result .nums div{font-weight:800;font-size:1.3rem}
.result .bubble{text-align:left}
.result .nums small{display:block;color:var(--muted);font-size:.78rem;font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.confetti i{position:absolute;top:-1rem;width:.6rem;height:.9rem;border-radius:.15rem;animation:fall linear both}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* Badges */
.badges{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.bd{display:inline-flex;align-items:center;gap:.3rem;background:var(--card);border-radius:2rem;padding:.25rem .7rem .25rem .4rem;font-weight:700;font-size:.82rem;box-shadow:0 2px 0 var(--line)}
.bd.off{opacity:.4;filter:grayscale(1)}
.bd .e{font-size:1.1rem}

/* Code */
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;line-height:1.5;word-break:break-all;background:var(--soft);border-radius:.8rem;padding:.8rem;user-select:all;-webkit-user-select:all}
textarea{width:100%;min-height:7rem;border:2px solid var(--line);border-radius:.8rem;padding:.6rem;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.card{background:var(--card);border-radius:1.2rem;padding:1rem;box-shadow:0 2px 0 var(--line);margin-bottom:.9rem}
.card h3{font-size:1.05rem;margin-bottom:.4rem}
.card p{font-weight:600;color:var(--muted);font-size:.92rem}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--sea-deep);color:#fff;font-weight:700;padding:.5rem 1rem;border-radius:2rem;z-index:9;animation:enter .25s ease-out}

/* Teacher report */
.rep table{width:100%;border-collapse:collapse;font-size:.88rem}
.rep th,.rep td{text-align:left;padding:.3rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
.rep th{color:var(--muted);font-weight:700}
.rep td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:.5rem;background:var(--line);border-radius:.3rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral)}
.foot{text-align:center;margin-top:2rem;font-size:.8rem;color:var(--muted);font-weight:600}
.foot button{background:none;border:0;color:var(--muted);font-weight:700;text-decoration:underline;padding:0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
@media (min-width:600px){
  .opts{grid-template-columns:repeat(auto-fit,minmax(10rem,1fr))}
}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <button class="brand" id="brand" aria-label="Home">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 36c6-14 22-22 40-18 6 1 10 5 12 10-8-2-14 0-18 4 2 4 1 9-3 12-6 5-17 6-25 2 3-2 5-5 5-9-4 1-8 1-11-1z" fill="#8FD3FF"/><path d="M26 18l6-10 3 12z" fill="#8FD3FF"/><circle cx="46" cy="27" r="2.2" fill="#0F2A44"/><path d="M50 31c-2 2-5 3-8 2" stroke="#0F2A44" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    <span>Grammar Ocean</span>
  </button>
  <span class="grow"></span>
  <span class="stat" title="Minutes today"><span class="ring" id="ring"><b id="ringmin">0</b></span></span>
  <span class="stat" title="Streak"><span class="ic">🔥</span><span id="streak">0</span></span>
  <span class="stat" title="Shells"><span class="ic">🐚</span><span id="xp">0</span></span>
  <button class="de-btn" id="debtn" title="Show German help">DE</button>
</div></header>
<main id="app"></main>
<script id="core">
// ===== Core: data, sentence generators, checking, progress code. No DOM in here. =====

const IRR = V.filter(v => v.p);
const third = w => /(s|sh|ch|x|o)$/.test(w) ? w + 'es' : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ies' : w + 's';
const ingw = (w, dbl) => /ie$/.test(w) ? w.slice(0, -2) + 'ying' : /[^e]e$/.test(w) ? w.slice(0, -1) + 'ing' : dbl ? w + w.slice(-1) + 'ing' : w + 'ing';
const edw = (w, dbl) => /e$/.test(w) ? w + 'd' : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + 'ied' : dbl ? w + w.slice(-1) + 'ed' : w + 'ed';
const first = (b, f) => b.replace(/^(\S+)/, f);
const f3 = v => v.s || first(v.b, third);
const fing = v => v.ing || first(v.b, w => ingw(w, v.dbl));
const fpast = v => v.p || first(v.b, w => edw(w, v.dbl));
const base1 = v => v.b.split(' ')[0];
// typical wrong forms
const wrong3 = v => { const w = base1(v); const rest = v.b.slice(w.length); const out = [v.b];
  if (/(s|sh|ch|x|o)$/.test(w)) out.push(w + 's' + rest); else if (/[^aeiou]y$/.test(w)) out.push(w + 's' + rest); else out.push(w + 'es' + rest);
  if (v.b === 'have') out.push('haves'); return uniq(out).filter(x => x !== f3(v)); };
const wrongPast = v => { const w = base1(v); const rest = v.b.slice(w.length); const out = [v.b, fing(v)];
  if (v.p) { out.push(edw(w, false) + rest); if (v.p !== v.b) out.push(w + 'ed' + rest); }
  else { if (v.dbl) out.push(w + 'ed' + rest); else if (/[^aeiou]y$/.test(w)) out.push(w + 'ed' + rest); else if (/e$/.test(w)) out.push(w + 'ed' + rest); else out.push(w + 'd' + rest); }
  out.push('was ' + v.b); return uniq(out).filter(x => x !== fpast(v)); };
const wrongIng = v => { const w = base1(v); const rest = v.b.slice(w.length); const out = [];
  if (v.dbl) out.push(w + 'ing' + rest); else if (/[^e]e$/.test(w)) out.push(w + 'ing' + rest); else out.push(w + w.slice(-1) + 'ing' + rest, w.replace(/y$/, 'i') + 'ing' + rest);

// ---- Item builders
const choiceItem = (o) => { const opts = uniq([o.answer, ...o.wrong]).slice(0, 3); return {type:'choice', pre:o.pre, hint:o.hint || '', options: shuffle(opts), answer:o.answer, cat:o.cat, tag:o.tag, ex:o.ex}; };
const typeItem = (o) => ({type:'type', pre:o.pre, hint:o.hint || '', answer:o.answer, alt:o.alt || [], cat:o.cat, tag:o.tag, ex:o.ex, tip:o.tip});
const orderItem = (o) => { let tiles = o.chunks; let sh = shuffle(tiles); if (sh.map(c => c.t).join('|') === tiles.map(c => c.t).join('|')) sh = sh.slice(1).concat(sh[0]); return {type:'order', tiles:sh, answer:joinC(tiles, o.q), alt:o.alt || [], cat:o.cat, tag:o.tag, ex:o.ex, ask:o.ask}; };
const fixItem = (o) => ({type:'fix', words:o.words, wrong:o.wrong, options:shuffle(uniq([o.answer, ...o.opts]).slice(0, 3)), answer:o.answer, cat:o.cat, tag:o.tag, ex:o.ex});
const gapPre = (cs, i, q) => { const c = cs.map((c, j) => j === i ? '___' : c.t).join(' '); return (cs[0] === cs[i] ? c : cap(c)) + (q ? '?' : '.'); };
const capIf = (s, i) => i === 0 ? cap(s) : s;

  pres_fix() { const s = sub({}), v = verb({act:1}); const r = Math.random();

    if (r < .75) { const s3 = sub({third:1}); const words = [{t:s3.t,r:'S'},{t:"don't",r:'A'},{t:v.b,r:'V'},...rest(v)]; return fixItem({words, wrong:1, answer:"doesn't", opts:['does','not'], cat:'pres_neg', tag:v.b}); }

// ---- Checking
function check(item, resp) {
  const a = norm(resp);
  if (item.type === 'choice' || item.type === 'fix') return a === norm(item.answer);

  const ask = {choice:'Choose the right word.', type:'Type the right form.', flash:'Wild verb! Type the past form.', order: it.ask || 'Build the sentence.', fix:'One word is wrong. Tap it!'}[it.type];
  if (it.type === 'choice') h = `<div class="task"><p class="ask">${ask}</p><p class="sentence">${gapHtml(it.pre, it.hint)}</p><div class="opts">${it.options.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`;
  if (it.type === 'type') h = `<div class="task"><p class="ask">${ask}</p><p class="sentence">${gapHtml(it.pre, it.hint)}</p><div class="typed"><input id="inp" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-label="your answer"><button class="btn sun" data-act="chk">Check</button></div><div class="row end" style="margin-top:.5rem"><button class="btn ghost sm" data-act="show">Show me</button></div></div>`;
  if (it.type === 'flash') h = `<div class="task"><p class="ask">${ask}</p><div class="flash"><div class="base">${esc(it.base)}</div><div class="mean ${state.de ? '' : 'hidden'}" id="lde">${esc(it.de)}</div><p class="ex">${gapHtml(it.pre)}</p></div><div class="typed"><input id="inp" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-label="past form"><button class="btn sun" data-act="chk">Check</button></div><div class="row end" style="margin-top:.5rem"><button class="btn ghost sm" data-act="show">Show me</button></div></div>`;
  if (it.type === 'order') h = `<div class="task"><p class="ask">${ask}</p><div class="build" id="build"></div><div class="pool" id="pool">${it.tiles.map((c, i) => tileHtml({t:c.t, r:'G'}, 'tap', i)).join('')}</div><div class="row end sp"><button class="btn ghost sm" data-act="clear">Clear</button><button class="btn sun" data-act="chk" id="chkbtn" disabled>Check</button></div></div>`;
  if (it.type === 'fix') h = `<div class="task"><p class="ask">${ask}</p><div class="tiles" id="fixrow">${it.words.map((c, i) => tileHtml({t: i === 0 ? cap(c.t) : c.t, r: 'G'}, 'tap', i)).join('')}</div><div class="opts hidden" id="fixopts">${it.options.map((o, i) => `<button class="opt" data-act="fixopt" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`;
  box.innerHTML = h + '<div id="fb"></div><div class="row end sp"><button class="btn hidden" data-act="next" id="nextbtn">Next ›</button></div>';
  const inp = $('#inp'); if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (round.done) $('#nextbtn').click(); else onCheck(); } }); }
  round.sel = []; }
function feedback(kind, text, sub, de, answer) { $('#fb').innerHTML = `<div class="fb ${kind}"><span class="ic">${kind === 'ok' ? '✅' : kind === 'no' ? '💡' : '🤔'}</span><div>${esc(text)}${answer ? '<b class="ans">✓ ' + esc(answer) + '</b>' : ''}${sub ? '<small>' + esc(sub) + '</small>' : ''}${de && state.de ? '<span class="de">' + esc(de) + '</span>' : ''}</div></div>`; }
function finish(ok, firstTry, wrongText) { const it = cur(); if (round.done) return; round.done = true; const res = ok && firstTry ? 'ok' : ok ? 'half' : 'no'; round.res.push(res);
  const gain = res === 'ok' ? 10 : res === 'half' ? 5 : 0; let bonus = 0; if (res === 'ok') { round.combo++; if (round.combo % 3 === 0) { bonus = 5; const c = document.createElement('div'); c.className = 'combo'; c.textContent = '🔥 Combo ×' + round.combo + ' +5'; document.body.appendChild(c); setTimeout(() => c.remove(), 1400); } } else round.combo = 0;
  if (gain + bonus) { state.xp += gain + bonus; round.xp += gain + bonus; xpFloat($('#fb'), gain + bonus); }
  const c = state.cats[it.cat] || [0, 0]; c[0]++; if (res !== 'ok') { c[1]++; round.cats[it.cat] = (round.cats[it.cat] || 0) + 1; state.miss.push([it.cat, it.tag || '', String(wrongText || '').slice(0, 18), String(it.answer).slice(0, 18), today()]); if (state.miss.length > 20) state.miss = state.miss.slice(-20); }
  state.cats[it.cat] = c; if (res === 'ok' && it.cat === 'past_irr') state.irrOK[it.tag] = 1; save(); updateTop();
  document.querySelectorAll('#prog i')[round.i].className = res; $('#nextbtn').classList.remove('hidden'); if (res === 'ok') $('#nextbtn').focus(); }
function right(firstTry) { const it = cur(); const g = $('#gap'); if (g) { g.textContent = it.answer; g.classList.add('ok'); } feedback('ok', rp(FINN_OK), firstTry ? '' : 'Second try – well done.'); finish(true, firstTry); }
function wrongFinal(wrongText) { const it = cur(); const g = $('#gap'); if (g) { g.textContent = it.answer; g.classList.add('ok'); } feedback('no', rp(FINN_NO), CAT[it.cat].ex, CAT[it.cat].de, it.answer); finish(false, false, wrongText); }
function onCheck() { const it = cur(); if (round.done) return;
  if (it.type === 'type' || it.type === 'flash') { const inp = $('#inp'); const v = inp.value; if (!norm(v)) { inp.focus(); return; } round.tries++;
    if (check(it, v)) { inp.classList.add('ok'); inp.disabled = true; right(round.tries === 1); } else if (round.tries === 1) { round.firstWrong = v; inp.classList.add('no'); setTimeout(() => inp.classList.remove('no'), 600); feedback('hint', rp(FINN_HINT), it.tip ? 'Tip: ' + it.tip : CAT[it.cat].n); inp.select(); } else { inp.classList.add('no'); inp.disabled = true; wrongFinal(round.firstWrong); } }
  if (it.type === 'order') { const text = CORE.joinC(round.sel.map(i => it.tiles[i]), /\?$/.test(it.answer)); round.tries++; const ok = check(it, text);
    if (ok) { colorBuild(); feedback('ok', rp(FINN_OK), 'Subject – verb – object – place – time'); finish(true, round.tries === 1); } else if (round.tries === 1) { round.firstWrong = text; feedback('hint', rp(FINN_HINT), 'Who? – does what? – what? – where? – when?'); } else { feedback('no', rp(FINN_NO), CAT[it.cat].ex, CAT[it.cat].de, it.answer); finish(false, false, round.firstWrong); }
    $('#chkbtn').disabled = ok || round.tries >= 2; } }
function colorBuild() { const it = cur(); $('#build').querySelectorAll('.tile').forEach(el => { el.className = 'tile r-' + (it.tiles[+el.dataset.i].r || 'G'); }); }
function renderBuild() { const it = cur(); $('#build').innerHTML = round.sel.map(i => tileHtml({t: it.tiles[i].t, r:'S'}, 'tap sm', i)).join(''); $('#build').querySelectorAll('.tile').forEach(el => { el.className = 'tile tap'; });
  $('#pool').querySelectorAll('.tile').forEach(el => el.classList.toggle('used', round.sel.includes(+el.dataset.i))); $('#chkbtn').disabled = round.sel.length !== it.tiles.length; }

// ---- actions
document.addEventListener('click', async e => { const b = e.target.closest('[data-act]'); if (!b) return; const act = b.dataset.act, id = b.dataset.id;
  if (act === 'home') go({name:'home'}); else if (act === 'island') go({name:'island', id}); else if (act === 'learn') go({name:'learn', id, step:0});
  else if (act === 'play') startRound(id); else if (act === 'continue') { const s = suggest(); if (!state.rounds[s.id] && s.learn.length) go({name:'learn', id:s.id, step:0}); else startRound(s.id); }
  else if (act === 'quit') { round = null; go({name:'island', id}); }
  else if (act === 'lnext') { lstep++; showScene(); } else if (act === 'lprev') { lstep--; showScene(); }
  else if (act === 'code') go({name:'code'}); else if (act === 'teacher') { location.hash = 'teacher'; go({name:'teacher'}); }
  else if (act === 'next') { round.i++; if (round.i >= round.items.length) endRound(); else { document.querySelectorAll('#prog i')[round.i].classList.add('cur'); mountItem(); window.scrollTo(0, 0); } }
  else if (act === 'opt') { if (round.done) return; const it = cur(); const i = +b.dataset.i; const ok = it.options[i] === it.answer; document.querySelectorAll('.opt').forEach((o, j) => { o.disabled = true; if (it.options[j] === it.answer) o.classList.add('ok'); else if (j === i) o.classList.add('no'); else o.classList.add('dim'); }); if (ok) right(true); else wrongFinal(it.options[i]); }
  else if (act === 'chk') onCheck();
  else if (act === 'show') { if (round.done) return; const inp = $('#inp'); inp.value = cur().answer; inp.disabled = true; wrongFinal(''); }
  else if (act === 'clear') { if (round.done) return; round.sel = []; renderBuild(); }
  else if (act === 'fixopt') { if (round.done) return; const it = cur(); const i = +b.dataset.i; const ok = it.options[i] === it.answer; document.querySelectorAll('#fixopts .opt').forEach((o, j) => { o.disabled = true; if (it.options[j] === it.answer) o.classList.add('ok'); else if (j === i) o.classList.add('no'); else o.classList.add('dim'); });
    const w = $('#fixrow').querySelector(`[data-i="${it.wrong}"]`); w.textContent = it.wrong === 0 ? cap(it.answer) : it.answer; w.className = 'tile r-V pulse'; if (ok) { feedback('ok', rp(FINN_OK), (round.taps === 1 ? '' : 'Found it on the second tap.')); finish(true, round.taps === 1); } else { feedback('no', rp(FINN_NO), CAT[it.cat].ex, CAT[it.cat].de, it.answer); finish(false, false, it.options[i]); } }
  else if (act === 'copy') { try { await navigator.clipboard.writeText(round_code); toast('Copied! Now paste it into your email.'); } catch (err) { toast('Select the code and copy it.'); } }
  else if (act === 'share') { try { await navigator.share({title:'My Grammar Ocean code', text:'Here is my Grammar Ocean code:\n' + round_code}); } catch (err) {} }
  else if (act === 'load') { try { const s = await decodeState($('#loadbox').value); if (!confirm('Replace your progress on this device with the code?')) return; state = fill(s); save(); toast('Loaded!'); go({name:'home'}); } catch (err) { toast('That code does not work. Check it and try again.'); } }
  else if (act === 'report') { try { const s = await decodeState($('#tbox').value); $('#rep').innerHTML = report(fill(s)); } catch (err) { $('#rep').innerHTML = '<div class="card"><p>Der Code lässt sich nicht lesen (' + esc(err.message) + '). Bitte den ganzen Code ab FINN1 einfügen.</p></div>'; } }
});
document.addEventListener('click', e => { const t = e.target.closest('.tile.tap'); if (!t || !round || round.done) return; const it = cur(); const i = +t.dataset.i;
  if (it.type === 'order') { if (t.parentElement.id === 'pool') { if (round.sel.includes(i)) return; round.sel.push(i); } else { round.sel = round.sel.filter(x => x !== i); } renderBuild(); $('#fb').innerHTML = ''; }
  if (it.type === 'fix' && $('#fixopts').classList.contains('hidden')) { round.taps++; if (i === it.wrong) { t.classList.add('sel', 'r-X'); $('#fixopts').classList.remove('hidden'); feedback('hint', 'Yes, that one! Now choose the right word.'); } else if (round.taps >= 2) { const w = $('#fixrow').querySelector(`[data-i="${it.wrong}"]`); w.classList.add('sel', 'r-X'); $('#fixopts').classList.remove('hidden'); feedback('hint', 'It is this one: ' + it.words[it.wrong].t + '. Now choose the right word.'); } else { t.classList.add('shake'); setTimeout(() => t.classList.remove('shake'), 500); feedback('hint', rp(FINN_HINT), 'Look at the verb and the time words.'); } } });
$('#brand').addEventListener('click', () => { if (round && view.name === 'play' && !confirm('Leave this round?')) return; round = null; go({name:'home'}); });
$('#debtn').addEventListener('click', () => { state.de = !state.de; save(); updateTop(); document.querySelectorAll('#lde, .fb .de').forEach(el => el.classList.toggle('hidden', !state.de)); if (view.name === 'result' || view.name === 'home') render(); });
function endRound() { const st = STAGES[round.stage]; const first = round.res.filter(x => x === 'ok').length; state.rounds[st.id] = (state.rounds[st.id] || 0) + 1; round.star = false;
  if (first >= 9 && starsOf(st.id) < 3) { state.stars[st.id] = starsOf(st.id) + 1; round.star = true; } const worst = Object.entries(round.cats).sort((a, b) => b[1] - a[1])[0]; round.worst = worst ? worst[0] : null; save(); go({name:'result'}); if (round.star) confetti(); checkBadges(); }

// ---- code
let round_code = '';
const exportState = () => ({v:1, xp:state.xp, days:state.days, stars:state.stars, rounds:state.rounds, cats:state.cats, miss:state.miss.slice(-20), irrOK:state.irrOK});
async function mountCode() { round_code = await encodeState(exportState()); $('#codebox').textContent = pretty(round_code); if (!navigator.share) $('#sharebtn').classList.add('hidden'); }
function report(s) { const days = Object.keys(s.days).sort(); const tot = Object.values(s.days).reduce((a, b) => a + b, 0); const last14 = []; for (let i = 13; i >= 0; i--) { const d = dayStr(i); last14.push([d, s.days[d] || 0]); }
  const fmt = d => d.slice(8, 10) + '.' + d.slice(5, 7) + '.'; const mins = x => Math.round(x / 60);
  const cats = Object.entries(s.cats).map(([k, v]) => ({k, a: v[0], w: v[1], q: v[0] ? v[1] / v[0] : 0})).sort((a, b) => b.w - a.w || b.q - a.q);
  const irr = Object.keys(s.irrOK || {}); const missVerbs = {}; s.miss.filter(m => m[0] === 'past_irr' || m[0] === 'past_ing').forEach(m => { missVerbs[m[1]] = (missVerbs[m[1]] || 0) + 1; });
  return `<div class="card"><h3>Übungszeit</h3><p>${days.length} Tage geübt, insgesamt ${mins(tot)} Minuten. Aktuelle Serie: ${streak(s)} Tage (ab 5 Minuten zählt ein Tag). Muscheln (Punkte): ${s.xp}.</p>
    <div style="overflow-x:auto;margin-top:.5rem"><table><tr>${last14.map(d => `<th>${fmt(d[0])}</th>`).join('')}</tr><tr>${last14.map(d => `<td class="n" style="${d[1] >= GOAL ? 'color:var(--foam-ink);font-weight:800' : d[1] ? 'font-weight:700' : 'color:var(--muted)'}">${mins(d[1])}</td>`).join('')}</tr></table></div><p style="margin-top:.3rem">Minuten je Tag der letzten zwei Wochen; grün = Tagesziel 12 Minuten erreicht.</p></div>
    <div class="card"><h3>Inseln und Sterne</h3><table><tr><th>Insel</th><th>Stufe</th><th>Runden</th><th>Sterne</th></tr>${WORLDS.map(w => w.stages.map(st => `<tr><td>${esc(w.name)}</td><td>${esc(st.name)}</td><td class="n">${s.rounds[st.id] || 0}</td><td>${starsHtml(s.stars[st.id] || 0)}</td></tr>`).join('')).join('')}</table><p style="margin-top:.3rem">Ein Stern je Runde mit mindestens 9 von 10 beim ersten Versuch, höchstens drei je Stufe.</p></div>
    <div class="card"><h3>Fehlerschwerpunkte</h3>${cats.length ? `<table><tr><th>Bereich</th><th>Aufgaben</th><th>Fehler</th><th style="width:30%">Quote</th></tr>${cats.map(c => `<tr><td>${esc(CAT[c.k] ? CAT[c.k].n : c.k)}</td><td class="n">${c.a}</td><td class="n">${c.w}</td><td><div class="bar"><i style="width:${Math.round(c.q * 100)}%"></i></div>${Math.round(c.q * 100)} %</td></tr>`).join('')}</table>` : '<p>Noch keine Aufgaben gelöst.</p>'}</div>
    <div class="card"><h3>Unregelmäßige Verben</h3><p>${irr.length} Verben schon beim ersten Versuch richtig${irr.length ? ': ' + irr.sort().map(esc).join(', ') : ''}.</p>${Object.keys(missVerbs).length ? `<p style="margin-top:.4rem">Noch unsicher: ${Object.entries(missVerbs).sort((a, b) => b[1] - a[1]).map(([v, n]) => esc(v) + ' (' + n + '×)').join(', ')}.</p>` : ''}</div>
    <div class="card"><h3>Letzte Fehler</h3>${s.miss.length ? `<table><tr><th>Tag</th><th>Bereich</th><th>geschrieben</th><th>richtig</th></tr>${s.miss.slice().reverse().map(m => `<tr><td>${fmt(m[4] || '')}</td><td>${esc(CAT[m[0]] ? CAT[m[0]].n : m[0])}${m[1] ? ' <span style="color:var(--muted)">(' + esc(m[1]) + ')</span>' : ''}</td><td style="color:var(--coral-ink)">${esc(m[2] || '–')}</td><td style="color:var(--foam-ink)">${esc(m[3])}</td></tr>`).join('')}</table>` : '<p>Keine Fehler gespeichert.</p>'}<p style="margin-top:.3rem">Die letzten 20 Fehler; „–“ heißt: „Show me“ gedrückt.</p></div>`; }

// ---- start
if (location.search.includes('debug')) window.__go = {round: () => round, state: () => state, view: () => view, go};
if (location.hash === '#teacher') view = {name:'teacher'};
render();
})();
</script>
</body>
</html>
